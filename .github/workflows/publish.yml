name: Collect and publish Agent Daily

on:
  workflow_dispatch:
    inputs:
      check_ai:
        description: Verify the configured model with one budgeted API call
        type: boolean
        default: false
  schedule:
    - cron: '15 0 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/data/feed.json'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'

concurrency:
  group: agent-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Run offline tests
        id: tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/ui.test.mjs
      - name: Collect public sources
        id: collect
        env:
          AI_ENABLED: ${{ inputs.check_ai && 'true' || vars.AI_ENABLED || 'false' }}
          AI_API_KEY: ${{ secrets.APIKEY_GETFREECREDITS }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_INPUT_CNY_PER_MILLION: ${{ vars.AI_INPUT_CNY_PER_MILLION }}
          AI_OUTPUT_CNY_PER_MILLION: ${{ vars.AI_OUTPUT_CNY_PER_MILLION }}
          AI_CHECK: ${{ inputs.check_ai || 'false' }}
        run: |
          args=()
          if [ "$AI_CHECK" = "true" ]; then args+=(--check-ai); fi
          python scripts/collect.py --max-items 80 "${args[@]}"
      - name: Persist feed and budget ledger
        if: always() && steps.collect.outcome != 'skipped' && steps.tests.outcome == 'success'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -f .state/collector.json ]; then git add .state/collector.json; fi
          git add site/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public news feed and collection ledger'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
