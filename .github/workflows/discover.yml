name: Discover and publish new official pages

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

concurrency:
  group: agent-daily-discovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.discover.outputs.changed }}
      published_count: ${{ steps.discover.outputs.published_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover, classify and publish new pages
        id: discover
        run: python scripts/discover.py
      - name: Commit feed and discovery ledger
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -f .state/discovery.json ]; then git add .state/discovery.json; fi
          if [ -f site/data/feed.json ]; then git add site/data/feed.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-publish discovered official pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.discover.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
