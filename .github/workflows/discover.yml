name: Discover new official pages

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

concurrency:
  group: agent-daily-discovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover new pages from official sitemaps
        id: discover
        run: python scripts/discover.py
      - name: Persist discovery ledger
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -f .state/discovery.json ]; then git add .state/discovery.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update discovered-pages ledger'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Open a review issue for new candidates
        if: steps.discover.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "发现 ${{ steps.discover.outputs.new_count }} 个候选新页面 ($(date -u +%F))" \
            --body-file .state/discovery-report.md
